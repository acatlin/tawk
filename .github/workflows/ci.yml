name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  examples:
    name: typecheck + tests (examples/)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  html:
    name: lesson pages parse and link to existing files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-links.mjs
